<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground</title>
    <style>
      #loading {
        position: absolute;
        z-index: 999;
        inset: 0;
        background: #fff;
      }
      #loading span {
        display: block;
        position: absolute;
        inset: 0;
        margin: auto;
        width: 2rem;
        height: 2rem;
        border: 2px solid;
        border-color: #0000 #000 #0000 #0000;
        border-radius: 50%;
      
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from {
          rotate: 0;
        }
        to {
          rotate: 1turn;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <span></span>
    </div>
    <main>
      <iframe id="output"></iframe>
      <div id="editor">
        <div class="toolbar">
          <button id="run">Run <span class="shh">(Ctrl+S)</span></button>
          <div></div>
          <button id="help-btn">Keyboard Shortcut</button>
        </div>
        <div role="tablist" id="tabs">
          <button role="tab" aria-selected="true" aria-controls="html">HTML</button>
          <button role="tab" aria-selected="false" aria-controls="css">CSS</button>
          <button role="tab" aria-selected="false" aria-controls="js">JS</button>
        </div>
        <div role="tabpanel" id="html"></div>
        <div role="tabpanel" id="css" hidden></div>
        <div role="tabpanel" id="js" hidden></div>
        <div id="resizer"></div>
      </div>
    </main>
    <dialog id="help">
      <p><strong>Note:</strong> Editor must be focused.</p>
      <table>
        <tr>
          <th>Run</th>
          <td>Ctrl + S</td>
        </tr>
        <tr>
          <th>HTML Tab</th>
          <td>Alt + 1</td>
        </tr>
        <tr>
          <th>CSS Tab</th>
          <td>Alt + 2</td>
        </tr>
        <tr>
          <th>JS Tab</th>
          <td>Alt + 3</td>
        </tr>
        <tr>
          <th>Switch to Left Tab</th>
          <td>Alt + ,</td>
        </tr>
        <tr>
          <th>Switch to Right Tab</th>
          <td>Alt + .</td>
        </tr>
      </table>
      <button id="close-help">Close</button>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
